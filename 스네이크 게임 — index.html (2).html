<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1110">
  <title>스네이크 아케이드</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1110;
      --panel: #121c19;
      --line: #24352e;
      --green: #54e38e;
      --mint: #a3ffc0;
      --muted: #9aada3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(14px, 4vw, 36px) 14px;
      display: flex;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 0%, #17251f 0%, var(--bg) 62%);
      color: #f3fff6;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .app {
      width: min(100%, 580px);
      text-align: center;
    }

    header { margin: 0 auto 18px; }

    .eyebrow {
      color: var(--green);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 7px 0 16px;
      font-size: clamp(1.65rem, 6vw, 2.45rem);
      line-height: 1.1;
      letter-spacing: -.04em;
    }

    .scorebar {
      width: min(100%, 540px);
      margin: 0 auto 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(18, 28, 25, .92);
    }

    .score-label {
      color: var(--muted);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .08em;
    }

    #score {
      color: var(--mint);
      font-size: 1.35rem;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .best { color: var(--muted); font-size: .82rem; }

    .board-wrap {
      position: relative;
      width: min(100%, 540px);
      margin: 0 auto;
      padding: 10px;
      border: 1px solid #2a3b33;
      border-radius: 18px;
      background: #111b17;
      box-shadow: 0 18px 55px #0008, inset 0 0 0 1px #ffffff08;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 10px;
      background: #0a120f;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 10px;
      display: grid;
      place-items: center;
      padding: 20px;
      border-radius: 10px;
      background: #07100edb;
    }

    .overlay[hidden] { display: none; }
    .overlay-card { max-width: 90%; }

    .overlay h2 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 6vw, 2rem);
    }

    .overlay p {
      margin: 0;
      color: #c1d2c8;
      line-height: 1.5;
    }

    .controls {
      width: min(100%, 540px);
      margin: 15px auto 0;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      min-height: 46px;
      padding: 10px 17px;
      border: 1px solid #345044;
      border-radius: 12px;
      background: #182720;
      color: #f4fff7;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: background .15s, transform .1s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      border-color: #4d8463;
      background: #20372a;
    }

    button:active { transform: scale(.96); }

    button.primary {
      border-color: #36a65d;
      background: #1d6b3e;
    }

    button.primary:hover { background: #25834b; }

    button:focus-visible {
      outline: 3px solid var(--mint);
      outline-offset: 3px;
    }

    .touch-area {
      display: none;
      width: min(100%, 540px);
      margin: 16px auto 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(18, 28, 25, .75);
      touch-action: manipulation;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, minmax(58px, 72px));
      grid-template-rows: repeat(2, 58px);
      justify-content: center;
      gap: 8px;
    }

    .dpad button {
      min-height: 58px;
      padding: 0;
      border-radius: 14px;
      background: #1a2b22;
      font-size: 1.35rem;
      touch-action: manipulation;
      user-select: none;
    }

    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }

    .help {
      margin: 14px auto 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.5;
    }

    @media (pointer: coarse), (max-width: 700px) {
      .touch-area { display: block; }
      .help .desktop { display: none; }
    }

    @media (max-width: 380px) {
      .scorebar { padding: 10px 12px; }
      .controls { gap: 7px; }
      .controls button { flex: 1; padding: 9px 12px; }
      .touch-area { padding: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">Arcade · Snake</div>
      <h1>스네이크</h1>
    </header>

    <section class="scorebar" aria-label="게임 점수">
      <div>
        <div class="score-label">SCORE</div>
        <div id="score" aria-live="polite">0</div>
      </div>
      <div class="best">최고 점수 <strong id="best">0</strong></div>
    </section>

    <div class="board-wrap">
      <canvas id="game" width="600" height="600"
        aria-label="20 곱하기 20 스네이크 게임판"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="overlayTitle">준비됐나요?</h2>
          <p id="overlayText">시작 버튼을 눌러 게임을 시작하세요.</p>
        </div>
      </div>
    </div>

    <div class="controls" aria-label="게임 조작">
      <button class="primary" id="startBtn" type="button">시작</button>
      <button id="pauseBtn" type="button" disabled>일시정지</button>
      <button id="restartBtn" type="button">다시 시작</button>
    </div>

    <section class="touch-area" aria-label="터치 방향 조작">
      <div class="dpad">
        <button class="up" data-dir="up" type="button" aria-label="위로">▲</button>
        <button class="left" data-dir="left" type="button" aria-label="왼쪽">◀</button>
        <button class="down" data-dir="down" type="button" aria-label="아래로">▼</button>
        <button class="right" data-dir="right" type="button" aria-label="오른쪽">▶</button>
      </div>
    </section>

    <p class="help">
      <span class="desktop">PC: 방향키로 이동 · </span>
      먹이를 먹으면 +10점 · 벽이나 자신의 몸에 부딪히면 게임이 끝납니다.
    </p>
  </main>

  <script>
    (() => {
      "use strict";

      const SIZE = 20;
      const CELL = 30;
      const STEP_MS = 145;

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const restartBtn = document.getElementById("restartBtn");

      const vectors = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      let snake, food, direction, queuedDirection;
      let score, best, state, timer;
      let turnLocked = false;

      try {
        best = Number(localStorage.getItem("snake-best") || 0);
      } catch (_) {
        best = 0;
      }
      bestEl.textContent = best;

      function randomFood() {
        const open = [];

        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            if (!snake.some(part => part.x === x && part.y === y)) {
              open.push({ x, y });
            }
          }
        }

        return open.length
          ? open[Math.floor(Math.random() * open.length)]
          : null;
      }

      function showOverlay(title, text) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        overlay.hidden = false;
      }

      function reset() {
        clearInterval(timer);
        timer = null;
        snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
        direction = { x: 1, y: 0 };
        queuedDirection = direction;
        score = 0;
        turnLocked = false;
        food = randomFood();
        state = "ready";

        scoreEl.textContent = score;
        startBtn.disabled = false;
        startBtn.textContent = "시작";
        pauseBtn.disabled = true;
        pauseBtn.textContent = "일시정지";

        showOverlay("준비됐나요?", "시작 버튼을 눌러 게임을 시작하세요.");
        draw();
      }

      function start() {
        if (state === "running") return;
        if (state === "over" || state === "won") reset();

        state = "running";
        overlay.hidden = true;
        startBtn.disabled = true;
        startBtn.textContent = "진행 중";
        pauseBtn.disabled = false;
        pauseBtn.textContent = "일시정지";
        timer = setInterval(tick, STEP_MS);
      }

      function togglePause() {
        if (state === "running") {
          clearInterval(timer);
          timer = null;
          state = "paused";
          startBtn.disabled = false;
          startBtn.textContent = "계속하기";
          pauseBtn.textContent = "계속하기";
          showOverlay("일시정지", "계속하기를 눌러 게임을 이어가세요.");
        } else if (state === "paused") {
          start();
        }
      }

      function setDirection(name) {
        if (state !== "running" || !vectors[name] || turnLocked) return;

        const next = vectors[name];

        // 현재 진행 방향의 정반대로 즉시 돌아서는 입력은 무시합니다.
        if (next.x === -direction.x && next.y === -direction.y) return;

        // 같은 방향을 반복 입력해도 턴 상태가 꼬이지 않습니다.
        if (next.x === direction.x && next.y === direction.y) return;

        queuedDirection = next;
        turnLocked = true;
      }

      function tick() {
        direction = queuedDirection;
        turnLocked = false;

        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y
        };
        const ate = food && head.x === food.x && head.y === food.y;
        const bodyToCheck = ate ? snake : snake.slice(0, -1);

        if (
          head.x < 0 || head.x >= SIZE ||
          head.y < 0 || head.y >= SIZE ||
          bodyToCheck.some(part => part.x === head.x && part.y === head.y)
        ) {
          finish(false);
          return;
        }

        snake.unshift(head);

        if (ate) {
          score += 10;
          scoreEl.textContent = score;

          if (score > best) {
            best = score;
            bestEl.textContent = best;
            try {
              localStorage.setItem("snake-best", String(best));
            } catch (_) {}
          }

          food = randomFood();
          if (!food) {
            finish(true);
            return;
          }
        } else {
          snake.pop();
        }

        draw();
      }

      function finish(won) {
        clearInterval(timer);
        timer = null;
        state = won ? "won" : "over";
        startBtn.disabled = false;
        startBtn.textContent = "다시 시작";
        pauseBtn.disabled = true;

        showOverlay(
          won ? "완벽해요!" : "게임 종료",
          won
            ? "모든 칸을 채웠습니다!"
            : `최종 점수: ${score}점 · 다시 시작을 눌러 재도전하세요.`
        );
        draw();
      }

      function roundedRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
        ctx.fill();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0a120f";
        ctx.fillRect(0, 0, 600, 600);

        ctx.strokeStyle = "rgba(145,190,160,.075)";
        ctx.lineWidth = 1;

        for (let i = 0; i <= SIZE; i++) {
          const p = i * CELL + .5;
          ctx.beginPath();
          ctx.moveTo(p, 0);
          ctx.lineTo(p, 600);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, p);
          ctx.lineTo(600, p);
          ctx.stroke();
        }

        if (food) {
          ctx.fillStyle = "#ff6b6b";
          ctx.shadowColor = "#ff5c5c";
          ctx.shadowBlur = 14;
          roundedRect(food.x * CELL + 5, food.y * CELL + 5, CELL - 10, CELL - 10, 8);
          ctx.shadowBlur = 0;
        }

        snake.forEach((part, index) => {
          ctx.fillStyle = index === 0 ? "#a3ffc0" : "#54e38e";
          ctx.shadowColor = index === 0 ? "#8dffb2" : "#39d979";
          ctx.shadowBlur = index === 0 ? 12 : 5;
          roundedRect(
            part.x * CELL + 3,
            part.y * CELL + 3,
            CELL - 6,
            CELL - 6,
            index === 0 ? 8 : 7
          );
        });

        ctx.shadowBlur = 0;

        if (snake.length) {
          const head = snake[0];
          let eye1 = { x: head.x * CELL + 12, y: head.y * CELL + 12 };
          let eye2 = { x: head.x * CELL + 20, y: head.y * CELL + 12 };

          if (direction.x === 1) {
            eye1 = { x: head.x * CELL + 20, y: head.y * CELL + 11 };
            eye2 = { x: head.x * CELL + 20, y: head.y * CELL + 19 };
          } else if (direction.x === -1) {
            eye1 = { x: head.x * CELL + 10, y: head.y * CELL + 11 };
            eye2 = { x: head.x * CELL + 10, y: head.y * CELL + 19 };
          } else if (direction.y === -1) {
            eye1 = { x: head.x * CELL + 11, y: head.y * CELL + 10 };
            eye2 = { x: head.x * CELL + 19, y: head.y * CELL + 10 };
          } else if (direction.y === 1) {
            eye1 = { x: head.x * CELL + 11, y: head.y * CELL + 20 };
            eye2 = { x: head.x * CELL + 19, y: head.y * CELL + 20 };
          }

          ctx.fillStyle = "#123520";
          [eye1, eye2].forEach(eye => {
            ctx.beginPath();
            ctx.arc(eye.x, eye.y, 2.1, 0, Math.PI * 2);
            ctx.fill();
          });
        }
      }

      const keyMap = {
        ArrowUp: "up",
        ArrowDown: "down",
        ArrowLeft: "left",
        ArrowRight: "right"
      };

      window.addEventListener("keydown", event => {
        if (keyMap[event.key]) {
          event.preventDefault();
          setDirection(keyMap[event.key]);
        } else if (event.key === " " || event.key === "Escape") {
          event.preventDefault();
          if (state === "ready") start();
          else togglePause();
        }
      }, { passive: false });

      document.querySelectorAll("[data-dir]").forEach(button => {
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          setDirection(button.dataset.dir);
        });
        button.addEventListener("click", event => {
          event.preventDefault();
          setDirection(button.dataset.dir);
        });
      });

      startBtn.addEventListener("click", start);
      pauseBtn.addEventListener("click", togglePause);
      restartBtn.addEventListener("click", () => {
        reset();
        start();
      });

      reset();
    })();
  </script>
</body>
</html>
